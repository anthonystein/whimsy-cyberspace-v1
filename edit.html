<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Edit Living Missions — Whimsy Cyberspace</title>
  <link rel="stylesheet" href="styles.css">
  <script src="edit.js" defer></script>
</head>
<body class="login-page">
  <div class="grain" aria-hidden="true"></div>
  <main class="login-shell">
    <form class="login-card">
      <span class="eyebrow">PRIVATE EDITING</span>
      <h1>Living missions</h1>
      <p>Sign in to add, update, complete, or archive missions inside the system.</p>
      <label>Admin passphrase<input name="passphrase" type="password" autocomplete="current-password" maxlength="256" required autofocus></label>
      <p class="login-message" role="status"></p>
      <button type="submit">Enter the system →</button>
      <a href="/">← Return to the public system</a>
    </form>
  </main>
</body>
</html>
